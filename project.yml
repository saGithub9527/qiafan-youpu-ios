name: QiafanYoupu
options:
  bundleIdPrefix: com.talka
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "26.3"
  # Xcode 26.3 cannot load local packages when their directory is also a Folder.
  postGenCommand: python3 scripts/remove_duplicate_local_package_folders.py
packages:
  QFSSE:
    path: Packages/QFSSE
  QFLocalLLM:
    path: Packages/QFLocalLLM
  QFOrbRenderer:
    path: Packages/QFOrbRenderer
  QFFilament:
    path: Packages/QFFilament
  DGCharts:
    url: https://github.com/ChartsOrg/Charts.git
    exactVersion: 5.1.0
  MJRefresh:
    url: https://github.com/CoderMJLee/MJRefresh.git
    exactVersion: 3.7.9
  MBProgressHUD:
    url: https://github.com/jdg/MBProgressHUD.git
    revision: 4a7c5f3e53cdea77c5dcb8578c2ee5acacdf6781
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.12.2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    exactVersion: 8.12.0
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    exactVersion: 6.0.0
  PLCrashReporter:
    url: https://github.com/microsoft/plcrashreporter.git
    exactVersion: 1.12.2
  JXSegmentedView:
    url: https://github.com/pujiaxin33/JXSegmentedView.git
    exactVersion: 1.4.1
  GetuiSDK:
    url: https://github.com/GetuiLaboratory/getui-sdk-ios-cocoapods.git
    revision: 464c86e453c9c06e23d71bcad3958d1f1b7a68ab
  GetuiCommonSDK:
    url: https://github.com/GetuiLaboratory/getui-gtcsdk-ios-cocoapods.git
    # The no-IDFA binary is API-compatible with GTCommonSDK and avoids adding an
    # advertising identifier dependency to an app that does not use advertising.
    revision: 80d402955ea0980730984c3d2d349dff9c2fe649
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: B654WGMW63
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      QF_API_BASE_URL: "https://test-api.yzsalingo.com/api/v1"
      QF_API_ENVIRONMENT: test
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    Release:
      QF_API_BASE_URL: ""
      QF_API_ENVIRONMENT: production
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
targets:
  QiafanYoupu:
    type: application
    platform: iOS
    sources:
      - path: QiafanYoupu
        # Base.lproj anchors the eight app-owned translations as one Xcode
        # Localizable.strings variant group under Resources/Localization.
        excludes: ["**/*.md", "Info.plist", "*.entitlements", "Resources/Legal"]
      - path: QiafanYoupu/Resources/Legal
        type: folder
        buildPhase: resources
    dependencies:
      - package: QFSSE
      - package: QFLocalLLM
      - package: QFOrbRenderer
      - package: QFFilament
        product: QFFilamentBridge
      - package: DGCharts
      - package: MJRefresh
      - package: MBProgressHUD
      - package: Alamofire
      - package: Kingfisher
      - package: SnapKit
      - package: JXSegmentedView
      - package: GetuiSDK
        product: GTSDK
      - package: GetuiCommonSDK
        product: GTCommonSDK
      # GTCommonSDK's binary SPM target omits its required system linker libraries.
      - sdk: libresolv.tbd
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
      - package: PLCrashReporter
        product: CrashReporter
    configFiles:
      Debug: Configuration/Getui.xcconfig
      Release: Configuration/Getui.xcconfig
    entitlements:
      path: QiafanYoupu/QiafanYoupu.entitlements
      properties:
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.applesignin: [Default]
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: QiafanYoupu/Info.plist
      properties:
        QFAPIBaseURL: $(QF_API_BASE_URL)
        QFAPIEnvironment: $(QF_API_ENVIRONMENT)
        QFGetuiAppID: $(QF_GETUI_APP_ID)
        QFGetuiAppKey: $(QF_GETUI_APP_KEY)
        QFGetuiAppSecret: $(QF_GETUI_APP_SECRET)
        GT_MinimumOSVersion: "15.0"
        NSCameraUsageDescription: 扫描小票上的二维码以录入采购明细。
        CFBundleDisplayName: 恰饭有谱
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        UILaunchStoryboardName: LaunchScreen
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: YES
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).QFSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talka.qiafanyoupu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 恰饭有谱
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  QiafanYoupuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QiafanYoupuTests
        excludes: [FilamentFixtures]
      - path: QiafanYoupuTests/FilamentFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: QiafanYoupu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talka.qiafanyoupu.tests
        GENERATE_INFOPLIST_FILE: YES
  QiafanYoupuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QiafanYoupuUITests
    dependencies:
      - target: QiafanYoupu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talka.qiafanyoupu.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QiafanYoupu:
    build:
      targets:
        QiafanYoupu: all
    test:
      config: Debug
      targets:
        - QiafanYoupuTests
        - QiafanYoupuUITests
    run:
      config: Debug
    archive:
      config: Release
  QiafanYoupu-ReleaseUI:
    build:
      targets:
        QiafanYoupu: all
    test:
      config: Release
      targets:
        - QiafanYoupuUITests
    run:
      config: Release

  QiafanYoupu-LiveTests:
    build:
      targets:
        QiafanYoupu: all
    test:
      config: Debug
      environmentVariables:
        QF_RUN_LIVE_AUTH_TEST: "1"
      targets:
        - name: QiafanYoupuUITests
          selectedTests:
            - QFConnectedUITests/testRealQuickLoginAndSessionRestore()
            - QFConnectedUITests/testStartupRequestAppearsInPaginatedDebugLog()
