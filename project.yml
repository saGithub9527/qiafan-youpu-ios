name: QiafanYoupu
options:
  bundleIdPrefix: com.talka
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: B654WGMW63
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG QF_UI_ONLY"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) QF_UI_ONLY"
targets:
  QiafanYoupu:
    type: application
    platform: iOS
    sources:
      - path: QiafanYoupu
        excludes: ["**/*.md", "Info.plist"]
    info:
      path: QiafanYoupu/Info.plist
      properties:
        CFBundleDisplayName: 恰饭有谱
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: YES
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talka.qiafanyoupu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  QiafanYoupuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QiafanYoupuTests
    dependencies:
      - target: QiafanYoupu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talka.qiafanyoupu.tests
        GENERATE_INFOPLIST_FILE: YES
  QiafanYoupuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QiafanYoupuUITests
    dependencies:
      - target: QiafanYoupu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talka.qiafanyoupu.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QiafanYoupu:
    build:
      targets:
        QiafanYoupu: all
    test:
      config: Debug
      targets:
        - QiafanYoupuTests
        - QiafanYoupuUITests
    run:
      config: Debug
    archive:
      config: Release
  QiafanYoupu-ReleaseUI:
    build:
      targets:
        QiafanYoupu: all
    test:
      config: Release
      targets:
        - QiafanYoupuUITests
    run:
      config: Release
